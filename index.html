<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宝宝的男朋友小窝</title>
  <style>
    body {
      background: #ffe4e6;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #d6336c;
      text-align: center;
    }
    #chat {
      border: 2px solid #d6336c;
      border-radius: 10px;
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      background: #fff0f6;
    }
    #inputArea {
      margin-top: 10px;
      display: flex;
    }
    #inputArea input {
      flex: 1;
      padding: 8px;
      border: 1px solid #d6336c;
      border-radius: 5px 0 0 5px;
      font-size: 16px;
    }
    #inputArea button {
      background: #d6336c;
      border: none;
      color: white;
      padding: 0 20px;
      font-size: 16px;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>宝宝的男朋友小窝</h1>
  <div id="chat"></div>
  <div id="inputArea">
    <input type="text" id="messageInput" placeholder="对他说点什么..." />
    <button onclick="sendMessage()">发送</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.textContent = sender + ": " + text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage("你", text);
      input.value = '';

      setTimeout(() => {
        // 这里简单模拟男朋友回复，可以后续接AI接口
        let reply = "宝宝，我听你说：" + text;
        appendMessage("男朋友", reply);
      }, 1000);
    }
  </script>
</body>
</html>
